        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Blog'
          description: ''
        '201':
          description: Added Successfully,.
        '400':
          description: Validation Error
  /login/:
    post:
      operationId: login_create
      summary: Log in a user.
      tags:
      - Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
  /register/:
    post:
      operationId: register_create
      summary: Register a new user.
      tags:
      - Register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
components:
  schemas:
    Blog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 155
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        user:
          type: integer
          readOnly: true
        like_count:
          type: integer
          readOnly: true
        comment_count:
          type: integer
          readOnly: true
        description:
          type: string
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
      required:
      - comment_count
      - created_at
      - id
      - like_count
      - slug
      - title
      - updated_at
      - user
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        username:
          type: string
          readOnly: true
        blog:
          type: integer
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blog
      - content
      - created_at
      - id
      - updated_at
      - user
      - username
    Like:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
        blog:
          type: integer
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blog
      - created_at
      - id
      - username
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    LoginResponse:
      type: object
      properties:
        message:
          type: string
        role:
          type: string
        username:
          type: string
        refresh:
          type: string
        access:
          type: string
      required:
      - access
      - message
      - refresh
      - role
      - username
    PatchedBlog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 155
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        user:
          type: integer
          readOnly: true
        like_count:
          type: integer
          readOnly: true
        comment_count:
          type: integer
          readOnly: true
        description:
          type: string
        created_at:
          type: string
          format: date
          readOnly: true
        updated_at:
          type: string
          format: date
          readOnly: true
    PatchedComment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        username:
          type: string
          readOnly: true
        blog:
          type: integer
        content:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    Register:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
      - username
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
