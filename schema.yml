  /blog_list_create/:
    get:
      operationId: blog_list_create_list
      description: Retrieve all blog or New blog
      summary: create Blog
      tags:
      - Blog
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Blog'
          description: ''
        '201':
          description: Added Successfully,.
        '400':
          description: Validation Error
    post:
      operationId: blog_list_create_create
      description: Retrieve all blog or New blog
      summary: create Blog
      tags:
      - Blog
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blog'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Blog'
          multipart/form-data:
            schema:
