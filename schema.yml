  /blog_comment{id}/:
    get:
      operationId: blog_comment_retrieve
      summary: Retrieve, Create or Delete Blog Comments
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Comment
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Success
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
        '400':
          description: Validation Error
        '401':
          description: Authentication Required
        '404':
          description: Comment or Blog Not Found
    post:
      operationId: blog_comment_create
      summary: Retrieve, Create or Delete Blog Comments
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Comment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Comment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Success
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
        '400':
          description: Validation Error
        '401':
          description: Authentication Required
        '404':
          description: Comment or Blog Not Found
    patch:
      operationId: blog_comment_partial_update
      summary: Retrieve, Create or Delete Blog Comments
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Comment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedComment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedComment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedComment'
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Success
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
        '400':
          description: Validation Error
        '401':
          description: Authentication Required
        '404':
          description: Comment or Blog Not Found
    delete:
      operationId: blog_comment_destroy
      summary: Retrieve, Create or Delete Blog Comments
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Comment
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Success
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
        '400':
          description: Validation Error
        '401':
          description: Authentication Required
        '404':
          description: Comment or Blog Not Found
