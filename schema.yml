  /blog_like/{id}/:
    post:
      operationId: blog_like_create
      summary: Like or Unlike Blog
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Like
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Like'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Like'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Like'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: Liked Succesfully.
        '200':
          description: Success.
        '400':
          description: Bad Request
        '404':
          description: Not Found.
    delete:
